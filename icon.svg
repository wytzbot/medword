<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
    <filter id="tileShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#gloss)"/>

    <!-- word-search selection swipe behind the diagonal D-N-A tiles -->
    <line x1="132" y1="125" x2="380" y2="373" stroke="#f59e0b" stroke-width="126" stroke-linecap="round" opacity="0.55"/>

    <!-- letter grid: 3x3 tiles, main diagonal spells D-N-A -->
    <g filter="url(#tileShadow)">
      <rect x="77"  y="70"  width="110" height="110" rx="24" fill="#fde68a"/>
      <rect x="201" y="70"  width="110" height="110" rx="24" fill="url(#tile)"/>
      <rect x="325" y="70"  width="110" height="110" rx="24" fill="url(#tile)"/>

      <rect x="77"  y="194" width="110" height="110" rx="24" fill="url(#tile)"/>
      <rect x="201" y="194" width="110" height="110" rx="24" fill="#fde68a"/>
      <rect x="325" y="194" width="110" height="110" rx="24" fill="url(#tile)"/>

      <rect x="77"  y="318" width="110" height="110" rx="24" fill="url(#tile)"/>
      <rect x="201" y="318" width="110" height="110" rx="24" fill="url(#tile)"/>
      <rect x="325" y="318" width="110" height="110" rx="24" fill="#fde68a"/>
    </g>

    <g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
      <text x="132" y="146" font-size="58" fill="#7c2d12">D</text>
      <text x="256" y="146" font-size="58" fill="#0f172a">R</text>
      <text x="380" y="146" font-size="58" fill="#0f172a">X</text>

      <text x="132" y="270" font-size="58" fill="#0f172a">M</text>
      <text x="256" y="270" font-size="58" fill="#7c2d12">N</text>
      <text x="380" y="270" font-size="58" fill="#0f172a">E</text>

      <text x="132" y="394" font-size="58" fill="#0f172a">S</text>
      <text x="256" y="394" font-size="58" fill="#0f172a">W</text>
      <text x="380" y="394" font-size="58" fill="#7c2d12">A</text>
    </g>

    <!-- medical cross badge -->
    <g filter="url(#badgeShadow)">
      <circle cx="418" cy="424" r="70" fill="#ffffff"/>
      <circle cx="418" cy="424" r="70" fill="none" stroke="#0d9488" stroke-width="6"/>
      <rect x="400" y="388" width="36" height="72" rx="8" fill="#ef4444"/>
      <rect x="382" y="406" width="72" height="36" rx="8" fill="#ef4444"/>
    </g>
  </g>
</svg>
